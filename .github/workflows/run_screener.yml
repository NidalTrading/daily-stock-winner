name: 123Aktien-Screener (Fadi + Qussai)

on:
  schedule:
    - cron: '30 13 * * 1-5'
    - cron: '30 14 * * 1-5'
    - cron: '0 20 * * 1-5'
    - cron: '0 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-screener:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Berlin time
        id: timecheck
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          BERLIN_H=$(TZ="Europe/Berlin" date +%H)
          BERLIN_M=$(TZ="Europe/Berlin" date +%M)
          M=$((10#$BERLIN_M))
          RUN=false
          if [ "$BERLIN_H" = "15" ] && [ "$M" -ge 20 ] && [ "$M" -le 40 ]; then RUN=true; fi
          if [ "$BERLIN_H" = "22" ] && [ "$M" -le 10 ]; then RUN=true; fi
          if [ "$BERLIN_H" = "21" ] && [ "$M" -ge 50 ]; then RUN=true; fi
          if [ "$RUN" = "true" ]; then
            echo "run=true" >> $GITHUB_OUTPUT
          else
            echo "run=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python
        if: steps.timecheck.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        if: steps.timecheck.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run main.py
        if: steps.timecheck.outputs.run == 'true'
        run: python main.py

      - name: Commit and push changes
        if: steps.timecheck.outputs.run == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add results/ reports/ TOP5_HISTORY.json 2>/dev/null || true
          git commit -m "Auto-update screener results [skip ci]" || exit 0
          for i in {1..3}; do
            git push && break || echo "Push fehlgeschlagen, Versuch $i von 3..."
            sleep 10
          done
