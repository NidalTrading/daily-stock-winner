name: Run Daily Stock Screener

on:
  schedule:
    # Läuft täglich um 09:00, 15:00 und 20:00 Uhr UTC
    # Entspricht im Winter (CET) 10:00, 16:00 und 21:00 Uhr deutscher Zeit
    - cron: '0 9,15,20 * * *'
  
  # Erlaubt das manuelle Starten über den GitHub-Reiter "Actions"
  workflow_dispatch:

jobs:
  run-screener:
    runs-on: ubuntu-latest

    steps:
      # 1. Repository auschecken
      suppress_decorations: false
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Python einrichten (Python 3.10)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # 3. Abhängigkeiten installieren
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests yfinance lxml html5lib

      # 4. Das Hauptskript ausführen (inkl. Telegram- & WhatsApp-Versand)
      - name: Run main.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_API_KEY: ${{ secrets.WHATSAPP_API_KEY }}
        run: |
          python main.py
