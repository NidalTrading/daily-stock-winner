name: Run Daily Stock Screener

on:
  schedule:
    - cron: '0 9,15,20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-screener:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests yfinance lxml html5lib

      - name: Run main.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_API_KEY: ${{ secrets.WHATSAPP_API_KEY }}
        run: |
          python main.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add SPNASDAQ100_RESULTS.csv TOP5_HISTORY.json
          git commit -m "Auto-update screener results and history [skip ci]" || exit 0
          
          # Push mit bis zu 3 Wiederholungsversuchen im Falle eines Server-Fehlers
          for i in {1..3}; do
            git push && break || echo "Push fehlgeschlagen, Versuch $i von 3..."
            sleep 10
          done
